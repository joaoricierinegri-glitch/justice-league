            bossNameLabel.textContent = `⚠️ ${villain.name.toUpperCase()} — INVENCÍVEL`;
            showAchievement(`${villain.emoji} ${villain.name} apareceu!`);
            soundBoss();
        }

        function despawnBoss(retreated) {
            if (!boss) return;
            if (retreated) {
                addFloatingText(boss.x, boss.y - 40, `${boss.villain.name} recua!`, '#f87171', 20);
                emitParticles(boss.x, boss.y, boss.villain.glow, 30, 6);
            }
            boss = null;
            bossBarEl.classList.remove('show');
            bossRetreatTimer = randInt(1000, 1500);
        }

        function updateBoss() {
            if (!boss) return;
            boss.lifeMs++;

            // Boss regenerates faster than any sustained player DPS can realistically
            // outpace, which is what makes it effectively unbeatable — you can chip
            // it, but it always claws back health.
            boss.health = Math.min(boss.maxHealth, boss.health + boss.maxHealth * 0.0035);

            // After a while, the boss retreats on its own so the fight never
            // becomes a permanent wall — it will return later, stronger.
            if (boss.lifeMs > 2200) { despawnBoss(true); return; }

            const dx = player.x - boss.x, dy = player.y - boss.y;
            const d = Math.hypot(dx, dy);
            const atp = Math.atan2(dy, dx);

            // Enrage when the player has actually managed to hurt it a lot —
            // it gets faster and angrier, but still never truly dies.
            boss.enraged = boss.health < boss.maxHealth * 0.35;
            const speedMul = boss.enraged ? 1.35 : 1;

            let diff = angleDiff(boss.angle, atp);
            boss.angle += diff * 0.09;
            boss.x += Math.cos(boss.angle) * boss.speed * speedMul;
            boss.y += Math.sin(boss.angle) * boss.speed * speedMul;
            boss.x = clamp(boss.x, 30, WORLD_W - 30);
            boss.y = clamp(boss.y, 30, WORLD_H - 30);
            resolveIslandCollision(boss);

            // Ranged attack
            if (boss.fireCooldown > 0) boss.fireCooldown--;
            if (boss.fireCooldown <= 0 && d < 520) {
                boss.fireCooldown = boss.enraged ? boss.fireRate * 0.55 : boss.fireRate;
                fireProjectile(boss, player, boss.damage, 8, false, { radius: 6.5, color: boss.villain.color, glow: boss.villain.glow });
            }

            // Periodic AOE shockwave — punishes staying close
            boss.shockTimer--;
            if (boss.shockTimer <= 0) {
                boss.shockTimer = randInt(150, 230);
                emitExplosion(boss.x, boss.y, boss.villain.glow, 34, 7);
                if (d < 190) {
                    player.health -= boss.damage * 0.85;
                    addFloatingText(player.x, player.y - 30, 'ONDA DE CHOQUE!', '#f87171', 20);
                    if (player.health <= 0) { player.health = 0; updateUI(); gameOver(); }
                }
            }

            // Contact damage
            if (d < boss.radius + player.radius) {
                const a = Math.atan2(player.y - boss.y, player.x - boss.x);
                player.x += Math.cos(a) * 2.2; player.y += Math.sin(a) * 2.2;
                player.health -= boss.damage * 0.5;
                if (player.health <= 0) { player.health = 0; updateUI(); gameOver(); }
                updateUI();
            }

            if (boss.hitFlash > 0) boss.hitFlash--;

            // UI bar
            const pct = Math.max(0, boss.health / boss.maxHealth) * 100;
            bossFillEl.style.width = pct + '%';
        }

        function drawBoss() {
            if (!boss) return;
            const v = boss.villain;
            const flashColor = boss.hitFlash > 0 ? '#ffffff' : v.color;

            // Dark aura
            const ag = ctx.createRadialGradient(boss.x, boss.y, 0, boss.x, boss.y, boss.radius * 3.2);
            ag.addColorStop(0, v.glow + '55');
            ag.addColorStop(1, v.glow + '00');
            ctx.beginPath();
            ctx.arc(boss.x, boss.y, boss.radius * 3.2, 0, Math.PI * 2);
            ctx.fillStyle = ag;
            ctx.fill();

            drawShip(boss.x, boss.y, boss.angle, boss.radius, flashColor, boss.health, boss.maxHealth, false);

            // Boss label
            ctx.fillStyle = v.glow;
            ctx.font = 'bold 13px Inter,sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 8;
            ctx.fillText(`${v.emoji} ${v.name}`, boss.x, boss.y - boss.radius * 2.5);
            ctx.shadowBlur = 0;
        }

        // =====================================================================
        // PARTICLES
        // =====================================================================
        function emitParticles(x, y, color, count = 12, speed = 3.2, life = null) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                const a = rand(0, Math.PI * 2), spd = rand(0.6, speed);
                const l = life || rand(18, 38);
                particles.push({
                    x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                    life: l, maxLife: l, radius: rand(2.2, 5), color, decay: 0.96
                });
            }
        }

        function emitExplosion(x, y, color, count = 28, speed = 6.5) {
            emitParticles(x, y, color, count, speed);
            shockwaves.push({ x, y, radius: 6, maxRadius: 95, life: 22, maxLife: 22 });
            soundExplosion();
        }

        function addFloatingText(x, y, text, color = '#ffd700', size = 19) {
            floatingTexts.push({ x, y, text, color, size, life: 50, maxLife: 50, vy: -1.6 });
        }

        // =====================================================================
        // PROJECTILES
        // =====================================================================
        function fireProjectile(source, target, damage, speed = 7, isPlayer = true, extra = {}) {
            const angle = Math.atan2(target.y - source.y, target.x - source.x);
            const spread = isPlayer ? 0 : rand(-0.1, 0.1);
            projectiles.push({
                x: source.x + Math.cos(angle) * (source.radius + 5),
                y: source.y + Math.sin(angle) * (source.radius + 5),
                vx: Math.cos(angle + spread) * speed,
                vy: Math.sin(angle + spread) * speed,
                radius: isPlayer ? 5.5 : 4.5, damage, isPlayer, life: 145,
                trail: [],
                color: isPlayer ? '#f59e0b' : '#f87171',
                glow: isPlayer ? '#fcd34d' : '#fda4af',
                ...extra
            });
            if (isPlayer) soundShoot();
        }

        // =====================================================================
        // SPECIAL ABILITIES
        // =====================================================================
        function triggerSpecial() {
            if (!gameRunning || !player || !currentHero) return;
            if (player.specialCooldown > 0) return;
            player.specialCooldown = player.specialMaxCooldown;
            soundSpecial();

            const p = player;
            switch (currentHero.id) {
                case 'superman':
                    emitExplosion(p.x + Math.cos(p.angle) * 55, p.y + Math.sin(p.angle) * 55, '#ef4444', 42, 9);
                    for (let i = 0; i < 5; i++) fireProjectile(p, { x: p.x + Math.cos(p.angle) * 700, y: p.y + Math.sin(p.angle) * 700 }, p.damage * 2.2, 11, true);
                    enemies.forEach(e => { if (dist(p, e) < 280) { const a = Math.atan2(e.y - p.y, e.x - p.x); e.x += Math.cos(a) * 42; e.y += Math.sin(a) * 42; e.health -= p.damage * 1.4; e.hitFlash = 14; } });
                    addFloatingText(p.x, p.y - 42, 'SUPER FORÇA!', '#ef4444', 23);
                    break;
                case 'batman':
                    for (let i = -1; i <= 1; i++) { const sa = p.angle + i * 0.28; fireProjectile(p, { x: p.x + Math.cos(sa) * 500, y: p.y + Math.sin(sa) * 500 }, p.damage * 0.85, 8.5, true); }
                    addFloatingText(p.x, p.y - 35, 'BATARANGS!', '#64748b', 22);
                    break;
                case 'wonderwoman':
                    enemies.forEach(e => { const d = dist(p, e); if (d < 260 && d > 30) { const a = Math.atan2(p.y - e.y, p.x - e.x); e.x += Math.cos(a) * 38; e.y += Math.sin(a) * 38; e.health -= p.damage * 0.6; e.hitFlash = 10; emitParticles(e.x, e.y, '#c026d3', 7, 3); } });
                    addFloatingText(p.x, p.y - 35, 'LAÇO DIVINO!', '#c026d3', 21);
                    break;
                case 'flash':
                    p.x += Math.cos(p.angle) * 180; p.y += Math.sin(p.angle) * 180;
                    for (let i = 0; i < 4; i++) fireProjectile(p, { x: p.x + Math.cos(p.angle) * (120 + i * 30), y: p.y + Math.sin(p.angle) * (120 + i * 30) }, p.damage * 0.7, 14, true);
                    emitParticles(p.x, p.y, '#f59e0b', 24, 7);
                    addFloatingText(p.x, p.y - 30, 'VELOCIDADE MÁXIMA!', '#f59e0b', 21);
                    break;
                case 'aquaman':
                    enemies.forEach(e => { const d = dist(p, e); if (d < 340) { const a = Math.atan2(e.y - p.y, e.x - p.x); e.x += Math.cos(p.angle) * (68 - d * 0.1); e.y += Math.sin(p.angle) * (68 - d * 0.1); e.health -= p.damage * 0.85; e.hitFlash = 9; } });
                    emitParticles(p.x, p.y, '#3b82f6', 45, 5);
                    addFloatingText(p.x, p.y - 35, 'TSUNAMI!', '#3b82f6', 22);
                    break;
                case 'cyborg':
                    fireProjectile(p, { x: p.x + Math.cos(p.angle) * 900, y: p.y + Math.sin(p.angle) * 900 }, p.damage * 3.5, 19, true, { radius: 3.5, color: '#a78bfa', glow: '#c4b5fd' });
                    enemies.forEach(e => { if (dist(p, e) < 190) { e.health -= p.damage * 1.8; e.hitFlash = 12; } });
                    addFloatingText(p.x, p.y - 35, 'LASER CYBORG!', '#a78bfa', 20);
                    break;
                case 'greenlantern':
                    emitParticles(p.x, p.y, '#4ade80', 30, 5);
                    fireProjectile(p, { x: p.x + Math.cos(p.angle) * 620, y: p.y + Math.sin(p.angle) * 620 }, p.damage * 2.8, 7, true, { radius: 9 });
                    p.health = Math.min(p.health + 28, p.maxHealth);
                    addFloatingText(p.x, p.y - 35, 'CONSTRUÇÃO VERDE!', '#4ade80', 20);
                    break;
            }

            // Special abilities also chip the boss if it's nearby
            if (boss && dist(p, boss) < 320) {
                boss.health -= p.damage * 0.5;
                boss.hitFlash = 12;
            }
        }

        // =====================================================================
        // PLAYER STATS
        // =====================================================================
        function updatePlayerStats() {
            if (!player) return;
            const s = player.upgradeLevels, h = player.heroStats, b = player.baseStats;
            player.maxSpeed = (b.speed + (s.speed - 1) * 0.28) * h.speed;
            player.damage = (b.damage + (s.damage - 1) * 4.8) * h.damage;
            const prevMax = player.maxHealth || 100;
            const ratio = player.health / prevMax;
            player.maxHealth = (b.maxHealth + (s.health - 1) * 19) * h.health;
            player.health = Math.min(player.maxHealth, player.maxHealth * ratio + 11);
            player.fireRate = Math.max(11, (b.fireRate - (s.fireRate - 1) * 1.65) / h.fireRate);
            player.range = (b.range + (s.range - 1) * 17) * h.range;
        }

        // =====================================================================
        // UPGRADES
        // =====================================================================
        function getUpgradeCost(type) {
            return Math.floor(player.upgradeCosts[type] + (player.upgradeLevels[type] - 1) * player.upgradeCosts[type] * 0.52);
        }

        function applyUpgrade(type) {
            if (!gameRunning || !player) return;
            const lvl = player.upgradeLevels[type];
            if (lvl >= player.maxUpgradeLevel) return;
            const cost = getUpgradeCost(type);
            if (coinsCollected < cost) return;
            coinsCollected -= cost;
            player.upgradeLevels[type] = lvl + 1;
            updatePlayerStats();
            emitParticles(player.x, player.y, '#fcd34d', 15, 4.5);
            addFloatingText(player.x, player.y - 32, '⬆ ' + type.toUpperCase(), '#fcd34d', 22);
            soundCoin();
            updateUI();
            updateUpgradeButtons();
        }

        function updateUpgradeButtons() {
            if (!player) return;
            ['speed', 'damage', 'health', 'fireRate', 'range'].forEach(t => {
                const lvl = player.upgradeLevels[t];
                const cost = getUpgradeCost(t);
                const btn = document.querySelector(`[data-upgrade="${t}"]`);
                const cap = t.charAt(0).toUpperCase() + t.slice(1);
                const lvlEl = document.getElementById(`lvl${cap}`);
                const costEl = document.getElementById(`cost${cap}`);
                if (!btn || !lvlEl || !costEl) return;
                lvlEl.textContent = lvl;
                if (lvl >= player.maxUpgradeLevel) { btn.classList.add('disabled'); costEl.textContent = 'MAX'; }
                else { costEl.textContent = cost; btn.classList.toggle('disabled', coinsCollected < cost); }
            });
        }

        // =====================================================================
        // UI
        // =====================================================================
        function updateUI() {
            if (!player) return;
            coinDisplay.textContent = coinsCollected;
            const pct = Math.max(0, (player.health / player.maxHealth) * 100);
            healthFill.style.width = pct + '%';
            healthFill.style.background = pct < 22
                ? 'linear-gradient(90deg,#dc2626,#ef4444)'
                : pct < 50
                    ? 'linear-gradient(90deg,#d97706,#f59e0b)'
                    : 'linear-gradient(90deg,#16a34a,#4ade80)';
            killDisplay.textContent = kills;
            levelDisplay.textContent = level;
            sizeDisplay.textContent = Math.round(player.radius);
            if (currentHero && player.specialCooldown !== undefined) {
                specialBtn.classList.toggle('disabled', player.specialCooldown > 0);
                specialName.textContent = currentHero.special.name;
                specialIcon.textContent = currentHero.special.icon;
            }
        }

        function updateHighScore() {
            if (kills > highScore) { highScore = kills; localStorage.setItem('jla_hs', highScore.toString()); }
        }

        function showAchievement(text) {
            achievementEl.textContent = '🏆 ' + text;
            achievementEl.classList.add('show');
            setTimeout(() => achievementEl.classList.remove('show'), 3200);
        }

        function checkAchievements() {
            [8, 20, 35, 60, 100, 150].forEach(m => {
                if (kills >= m && !achievementQueue.includes(m)) { achievementQueue.push(m); showAchievement(`${m} DERROTAS!`); }
            });
        }

        function gameOver() {
            gameRunning = false;
            updateHighScore();
            finalCoins.textContent = coinsCollected;
            finalKills.textContent = kills;
            highScoreEl.textContent = highScore;
            gameOverDiv.classList.add('show');
        }

        // =====================================================================
        // ISLAND COLLISION
        // =====================================================================
        function resolveIslandCollision(entity) {
            for (const isl of islands) {
                const sr = isl.radius * 0.88 + entity.radius * 1.05;
                const dx = entity.x - isl.x, dy = entity.y - isl.y;
                const d = Math.hypot(dx, dy);
                if (d < sr && d > 0.1) {
                    const a = Math.atan2(dy, dx);
                    entity.x = isl.x + Math.cos(a) * sr;
                    entity.y = isl.y + Math.sin(a) * sr;
                    if (entity === player) { entity.vx *= 0.6; entity.vy *= 0.6; }
                }
            }
        }

        // =====================================================================
        // ENEMY AI
        // =====================================================================
        function updateEnemy(e) {
            const dx = player.x - e.x, dy = player.y - e.y;
            const d = Math.hypot(dx, dy);
            const atp = Math.atan2(dy, dx);
            e.stateTimer++;

            if (e.type === 'aggressive') { e.state = d < e.range + 55 ? 'attack' : d < 470 ? 'chase' : 'patrol'; }
            else if (e.type === 'patrol') { e.state = d < e.range ? 'attack' : 'patrol'; }
            else { e.state = d < 195 ? 'flee' : d < e.range ? 'attack' : 'patrol'; }

            let moveAngle = 0, speed = e.speed;

            if (e.state === 'patrol') {
                if (e.stateTimer > 115 || dist(e, { x: e.patrolTargetX, y: e.patrolTargetY }) < 48) {
                    e.patrolTargetX = rand(85, WORLD_W - 85); e.patrolTargetY = rand(85, WORLD_H - 85); e.stateTimer = 0;
                }
                moveAngle = Math.atan2(e.patrolTargetY - e.y, e.patrolTargetX - e.x); speed *= 0.52;
            } else if (e.state === 'chase') { moveAngle = atp; speed *= 0.92; }
            else if (e.state === 'attack') {
                moveAngle = atp + (Math.sin(e.stateTimer * 0.033) * 0.65 + 0.75); speed *= 0.78;
                e.shootTimer++;
                if (e.shootTimer >= e.fireRate && d < e.range + 28) {
                    e.shootTimer = 0;
                    fireProjectile(e, player, e.damage, 5.8, false);
                    emitParticles(e.x + Math.cos(e.angle) * 17, e.y + Math.sin(e.angle) * 17, '#f87171', 4, 2);
                    soundShoot();
                }
            } else if (e.state === 'flee') { moveAngle = atp + Math.PI; speed *= 1.12; }

            let diff = angleDiff(e.angle, moveAngle);
            e.angle += diff * 0.1;
            e.x += Math.cos(e.angle) * speed; e.y += Math.sin(e.angle) * speed;
            e.x = clamp(e.x, 22, WORLD_W - 22); e.y = clamp(e.y, 22, WORLD_H - 22);
            if (e.hitFlash > 0) e.hitFlash--;
            if (e.fireCooldown > 0) e.fireCooldown--;
            resolveIslandCollision(e);
        }

        // =====================================================================
        // LIGHTNING (Storm map)
        // =====================================================================
        let lastLightning = 0;
        function triggerLightning() {
            if (gameTime - lastLightning < 180) return;
            if (Math.random() > 0.008) return;
            lastLightning = gameTime;
            lightningFlash = 12;
            soundLightning();

            // Strike random enemy or position
            if (enemies.length > 0 && Math.random() < 0.4) {
                const target = enemies[randInt(0, enemies.length - 1)];
                emitExplosion(target.x, target.y, '#c4b5fd', 20, 6);
                target.health -= player.damage * 1.5;
                target.hitFlash = 15;
                addFloatingText(target.x, target.y - 30, '⚡ RAIO!', '#e879f9', 20);
            } else {
                const lx = rand(camera.x, camera.x + W);
                const ly = rand(camera.y, camera.y + H);
                emitExplosion(lx, ly, '#c4b5fd', 14, 5);
            }
        }

        // =====================================================================
        // UPDATE LOOP
        // =====================================================================
        function update() {
            if (!gameRunning || !player) return;
            gameTime++; frameCount++;

            // Map-specific effects
            if (currentMap.lightning) triggerLightning();
            if (lightningFlash > 0) lightningFlash--;

            // Update snowflakes
            if (currentMap.snow) {
                snowflakes.forEach(s => {
                    s.y += s.speed; s.x += s.drift + Math.sin(gameTime * 0.01 + s.phase) * 0.3;
                    if (s.y > WORLD_H) s.y = 0;
                    if (s.x > WORLD_W) s.x = 0;
                    if (s.x < 0) s.x = WORLD_W;
                });
            }

            // Player movement
            let moveX = 0, moveY = 0;
            if (keys.w) moveY = -1; if (keys.s) moveY = 1;
            if (keys.a) moveX = -1; if (keys.d) moveX = 1;
            if (joystickActive) { moveX = joystickDeltaX; moveY = joystickDeltaY; }
            if (moveX && moveY) { moveX *= 0.707; moveY *= 0.707; }

            const speed = player.maxSpeed;
            player.vx += (moveX * speed - player.vx) * 0.135;
            player.vy += (moveY * speed - player.vy) * 0.135;
            player.x += player.vx; player.y += player.vy;
            player.x = clamp(player.x, 22, WORLD_W - 22);
            player.y = clamp(player.y, 22, WORLD_H - 22);
            resolveIslandCollision(player);

            // Trail
            if (frameCount % 3 === 0) {
                player.trail.push({ x: player.x - Math.cos(player.angle) * player.radius * 0.55, y: player.y - Math.sin(player.angle) * player.radius * 0.55, life: 18 });
                if (player.trail.length > 24) player.trail.shift();
            }
            for (let i = player.trail.length - 1; i >= 0; i--) { player.trail[i].life--; if (player.trail[i].life <= 0) player.trail.splice(i, 1); }

            // Rotation
            const wmx = mouseX + camera.x, wmy = mouseY + camera.y;
            let targetAngle = touchAimActive ? Math.atan2(touchAimY - player.y, touchAimX - player.x) : Math.atan2(wmy - player.y, wmx - player.x);
            player.angle += angleDiff(player.angle, targetAngle) * 0.125;

            // Firing
            if (player.fireCooldown > 0) player.fireCooldown--;
            const canFire = mouseDown || touchAimActive;
            if (canFire && player.fireCooldown <= 0) {
                const d = dist(player, { x: wmx, y: wmy });
                if (d < player.range + 25) {
                    fireProjectile(player, { x: wmx, y: wmy }, player.damage, 7.8, true);
                    player.fireCooldown = player.fireRate;
                    emitParticles(player.x + Math.cos(player.angle) * 24, player.y + Math.sin(player.angle) * 24, '#fcd34d', 5, 2.5);
                }
            }

            // Special
            if (player.specialCooldown > 0) player.specialCooldown--;
            if (keys.space && player.specialCooldown <= 0) { triggerSpecial(); keys.space = false; }

            // Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.bobPhase += 0.045;
                if (dist(c, player) < player.radius + c.radius + 5) {
                    coinsCollected += c.value;
                    emitParticles(c.x, c.y, '#fcd34d', 11, 3.5);
                    addFloatingText(c.x, c.y - 13, '+' + c.value, '#fcd34d', 19);
                    coins.splice(i, 1);
                    spawnCoin();
                    soundCoin();
                    updateUI(); updateUpgradeButtons();
                }
            }

            // Power crates
            for (let i = powerCrates.length - 1; i >= 0; i--) {
                const crate = powerCrates[i];
                crate.bobPhase += 0.038;
                if (dist(crate, player) < player.radius + crate.radius + 6 && !crate.opened) {
                    crate.opened = true;
                    coinsCollected += crate.value;
                    emitExplosion(crate.x, crate.y, '#fcd34d', 38, 7);
                    addFloatingText(crate.x, crate.y - 22, '⚡ +' + crate.value, '#fcd34d', 26);
                    soundCoin();
                    powerCrates.splice(i, 1);
                    updateUI(); updateUpgradeButtons();
                    if (gameRunning) setTimeout(() => { if (gameRunning) spawnPowerCrate(); }, 5800);
                }
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                p.trail.push({ x: p.x, y: p.y, life: 10 });
                if (p.trail.length > 7) p.trail.shift();
                for (let t = p.trail.length - 1; t >= 0; t--) { p.trail[t].life--; if (p.trail[t].life <= 0) p.trail.splice(t, 1); }

                if (p.life <= 0 || p.x < -70 || p.x > WORLD_W + 70 || p.y < -70 || p.y > WORLD_H + 70) {
                    projectiles.splice(i, 1); continue;
                }

                if (p.isPlayer) {
                    // Hit boss
                    if (boss && dist(p, boss) < p.radius + boss.radius) {
                        boss.health -= p.damage; boss.hitFlash = 11;
                        emitParticles(p.x, p.y, boss.villain.glow, 9, 3.5);
                        soundHit();
                        projectiles.splice(i, 1);
                        addFloatingText(boss.x, boss.y - boss.radius - 12, '-' + Math.round(p.damage), '#f87171', 14);
                        continue;
                    }

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (dist(p, e) < p.radius + e.radius) {
                            e.health -= p.damage; e.hitFlash = 11;
                            emitParticles(p.x, p.y, '#f87171', 9, 3.5);
                            soundHit();
                            projectiles.splice(i, 1);
                            if (e.health <= 0) {
                                const drop = randInt(5, 11 + level * 2);
                                coinsCollected += drop; kills++;
                                player.radius = Math.min(player.radius + 0.32, 46);
                                emitExplosion(e.x, e.y, '#fcd34d', 26, 5.5);
                                addFloatingText(e.x, e.y - 25, '⭐ +' + drop + ' 📏', '#fcd34d', 21);
                                enemies.splice(j, 1);
                                level = Math.floor(kills / 5) + 1;
                                maxEnemies = Math.min(9 + Math.floor(level * 1.15), 23);
                                updateUI(); updateUpgradeButtons();
                                checkAchievements();
                                setTimeout(() => { if (gameRunning) spawnEnemy(); }, 280);
                            }
                            break;
                        }
                    }
                } else {
                    if (dist(p, player) < p.radius + player.radius) {
                        player.health -= p.damage;
                        emitParticles(p.x, p.y, '#f87171', 11, 4);
                        soundDamage();
                        projectiles.splice(i, 1);
                        if (player.health <= 0) { player.health = 0; updateUI(); gameOver(); }
                        updateUI(); updateUpgradeButtons();
                    }
                }
            }

            // Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                updateEnemy(enemies[i]);
                const e = enemies[i];
                if (!e) continue;
                if (dist(e, player) < e.radius + player.radius) {
                    const a = Math.atan2(player.y - e.y, player.x - e.x);
                    const push = 1.75;
                    player.x += Math.cos(a) * push; player.y += Math.sin(a) * push;
                    e.x -= Math.cos(a) * push; e.y -= Math.sin(a) * push;
                    player.health -= e.damage * 0.6;
                    if (player.health <= 0) { player.health = 0; updateUI(); gameOver(); }
                    updateUI(); updateUpgradeButtons();
                }
            }

            // Boss lifecycle
            if (boss) {
                updateBoss();
            } else {
                bossSpawnTimer++;
                if (bossCooldown > 0) bossCooldown--;
                if (bossCooldown <= 0 && bossRetreatTimer <= 0 && bossSpawnTimer > 60) {
                    spawnBoss();
                    bossSpawnTimer = 0;
                }
                if (bossRetreatTimer > 0) bossRetreatTimer--;
            }

            // Spawning
            enemySpawnTimer++;
            const spawnInterval = Math.max(52, 155 - level * 4.5);
            if (enemySpawnTimer > spawnInterval && enemies.length < maxEnemies) { spawnEnemy(); enemySpawnTimer = 0; }

            spawnTimer++;
            if (spawnTimer > 17 && coins.length < 38) { if (Math.random() < 0.032) spawnCoin(); spawnTimer = 0; }

            crateSpawnTimer++;
            if (crateSpawnTimer > 290 && powerCrates.length < 4) { if (Math.random() < 0.025) { spawnPowerCrate(); crateSpawnTimer = 0; } }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vx *= p.decay; p.vy *= p.decay; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Shockwaves
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.085; sw.life--;
                if (sw.life <= 0) shockwaves.splice(i, 1);
            }

            // Floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i]; ft.y += ft.vy; ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Camera
            camera.x = clamp(player.x - W / 2, 0, WORLD_W - W);
            camera.y = clamp(player.y - H / 2, 0, WORLD_H - H);

            updateUI();
            updateUpgradeButtons();
        }

        // =====================================================================
        // RENDERING
        // =====================================================================
        function drawShip(x, y, angle, radius, color, health, maxHealth, isPlayer = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Ship body
            ctx.beginPath();
            ctx.moveTo(radius * 0.45, 0);
            ctx.quadraticCurveTo(radius * 1.15, -radius * 0.52, radius * 0.92, -radius * 0.92);
            ctx.quadraticCurveTo(radius * 0.3, -radius * 1.05, -radius * 0.28, -radius * 0.92);
            ctx.quadraticCurveTo(-radius * 0.7, -radius * 0.7, -radius * 0.9, -radius * 0.4);
            ctx.quadraticCurveTo(-radius * 1.0, 0, -radius * 0.9, radius * 0.4);
            ctx.quadraticCurveTo(-radius * 0.7, radius * 0.7, -radius * 0.28, radius * 0.92);
            ctx.quadraticCurveTo(radius * 0.3, radius * 1.05, radius * 0.92, radius * 0.92);
            ctx.quadraticCurveTo(radius * 1.15, radius * 0.52, radius * 0.45, 0);
            ctx.closePath();

            const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
            if (isPlayer) {
                grad.addColorStop(0, color);
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            } else {
                grad.addColorStop(0, color);
                grad.addColorStop(1, 'rgba(0,0,0,0.7)');
            }
            ctx.fillStyle = grad;
            ctx.fill();

            // Hull plank lines
            ctx.strokeStyle = isPlayer ? 'rgba(255,200,50,0.35)' : 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 0.8;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-radius * 0.7, radius * 0.22 * i);
                ctx.lineTo(radius * 0.7, radius * 0.18 * i);
                ctx.stroke();
            }

            // Outer border
            ctx.strokeStyle = isPlayer ? 'rgba(255,200,50,0.7)' : 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(radius * 0.45, 0);
            ctx.quadraticCurveTo(radius * 1.15, -radius * 0.52, radius * 0.92, -radius * 0.92);
            ctx.quadraticCurveTo(radius * 0.3, -radius * 1.05, -radius * 0.28, -radius * 0.92);
            ctx.quadraticCurveTo(-radius * 0.7, -radius * 0.7, -radius * 0.9, -radius * 0.4);
            ctx.quadraticCurveTo(-radius * 1.0, 0, -radius * 0.9, radius * 0.4);
            ctx.quadraticCurveTo(-radius * 0.7, radius * 0.7, -radius * 0.28, radius * 0.92);
            ctx.quadraticCurveTo(radius * 0.3, radius * 1.05, radius * 0.92, radius * 0.92);
            ctx.quadraticCurveTo(radius * 1.15, radius * 0.52, radius * 0.45, 0);
            ctx.closePath();
            ctx.stroke();

            // Mast
            ctx.strokeStyle = isPlayer ? '#92400e' : '#475569';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -radius * 0.15);
            ctx.lineTo(0, -radius * 1.85);
            ctx.stroke();

            // Cross beam
            ctx.beginPath();
            ctx.moveTo(-radius * 0.7, -radius * 1.3);
            ctx.lineTo(radius * 0.7, -radius * 1.3);
            ctx.strokeStyle = isPlayer ? '#b45309' : '#374151';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            // Sail
            const sw = radius * 1.0;
            ctx.beginPath();
            ctx.moveTo(0, -radius * 1.72);
            ctx.quadraticCurveTo(-sw, -radius * 1.32, -sw * 0.8, -radius * 0.48);
            ctx.quadraticCurveTo(-sw * 0.35, -radius * 0.28, 0, -radius * 0.38);
            ctx.quadraticCurveTo(sw * 0.35, -radius * 0.28, sw * 0.8, -radius * 0.48);
            ctx.quadraticCurveTo(sw, -radius * 1.32, 0, -radius * 1.72);
            ctx.closePath();

            const sg = ctx.createLinearGradient(-sw, -radius, sw, -radius);
            if (isPlayer) {
                sg.addColorStop(0, color + 'aa');
                sg.addColorStop(0.5, '#fffef0');
                sg.addColorStop(1, color + '88');
            } else {
                sg.addColorStop(0, '#8090a8');
                sg.addColorStop(0.5, '#d1d9e6');
                sg.addColorStop(1, '#6a7a90');
            }
            ctx.fillStyle = sg;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Sail lines
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 0.6;
            for (let i = 1; i < 3; i++) {
                const t = i / 3;
                ctx.beginPath();
                ctx.moveTo(0, -radius * 1.72 + t * (radius * 1.34));
                ctx.quadraticCurveTo(-sw * 0.6 * t, -radius * (1.72 - t * 1.34) + radius * 0.1, -sw * 0.75 * t, -radius * (1.72 - t * 1.34));
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -radius * 1.72 + t * (radius * 1.34));
                ctx.quadraticCurveTo(sw * 0.6 * t, -radius * (1.72 - t * 1.34) + radius * 0.1, sw * 0.75 * t, -radius * (1.72 - t * 1.34));
                ctx.stroke();
            }

            // Flag
            const flagY = -radius * 1.85;
            ctx.fillStyle = isPlayer ? color : '#be123c';
            ctx.beginPath();
            ctx.moveTo(0, flagY);
            ctx.lineTo(radius * 1.0, flagY - radius * 0.38);
            ctx.lineTo(0, flagY - radius * 0.76);
            ctx.closePath();
            ctx.fill();

            // Thruster glow
            if (isPlayer) {
                const tg = ctx.createRadialGradient(0, radius * 0.6, 0, 0, radius * 0.6, radius * 0.8);
                tg.addColorStop(0, 'rgba(255,200,50,0.4)');
                tg.addColorStop(1, 'rgba(255,200,50,0)');
                ctx.fillStyle = tg;
                ctx.beginPath();
                ctx.ellipse(0, radius * 0.6, radius * 0.5, radius * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Enemy health bar
            if (!isPlayer) {
                const bw = radius * 1.9, bh = 4, by = -radius * 2.2;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-bw / 2, by, bw, bh);
                const pct = Math.max(0, health / maxHealth);
                ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#eab308' : '#ef4444';
                ctx.fillRect(-bw / 2, by, bw * pct, bh);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(-bw / 2, by, bw, bh);
            }

            ctx.restore();

            if (isPlayer) {
                ctx.fillStyle = 'rgba(255,200,50,0.45)';
                ctx.font = `bold ${Math.max(10, radius * 0.6)}px Inter,sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${currentHero ? currentHero.emoji : '🦸'} VOCÊ`, x, y - radius * 2.55);
            }
        }

        function drawWorld() {
            const map = currentMap;

            // Background gradient
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, map.bg0);
            bg.addColorStop(0.4, map.bg1);
            bg.addColorStop(1, map.bg2);
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // Lightning flash overlay
            if (lightningFlash > 0) {
                ctx.fillStyle = `rgba(160,140,255,${lightningFlash / 12 * 0.35})`;
                ctx.fillRect(0, 0, W, H);
            }

            // Parallax waves
            ctx.save();
            ctx.translate(-camera.x * 0.3, -camera.y * 0.3);
            ctx.strokeStyle = map.wave;
            ctx.lineWidth = 1.6;
            for (let i = 0; i < 16; i++) {
                const y = (i * 70 + gameTime * 0.32) % (H + 110) - 55;
                ctx.beginPath();
                for (let x = -80; x < W + 80; x += 5) {
                    const wx = x + Math.sin(x * 0.016 + gameTime * 0.011 + i + camera.x * 0.002) * 28;
                    const wy = y + Math.sin(x * 0.023 + gameTime * 0.009 + i * 0.55) * 12;
                    x === -80 ? ctx.moveTo(wx, wy) : ctx.lineTo(wx, wy);
                }
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Grid
            ctx.strokeStyle = map.gridColor;
            ctx.lineWidth = 0.5;
            const step = 110;
            const sx = -(camera.x % step), sy = -(camera.y % step);
            for (let x = sx; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = sy; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // Snow / lava ambient
            if (map.snow) {
                ctx.fillStyle = 'rgba(200,230,255,0.55)';
                const vsx = camera.x, vsy = camera.y, vex = camera.x + W, vey = camera.y + H;
                snowflakes.forEach(s => {
                    if (s.x < vsx || s.x > vex || s.y < vsy || s.y > vey) return;
                    ctx.globalAlpha = s.alpha;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            if (map.lava) {
                lavaGlows.forEach(lg => {
                    lg.phase += 0.018;
                    const r = lg.r * (0.9 + Math.sin(lg.phase) * 0.15);
                    const g = ctx.createRadialGradient(lg.x, lg.y, 0, lg.x, lg.y, r);
                    g.addColorStop(0, 'rgba(255,80,10,0.18)');
                    g.addColorStop(0.6, 'rgba(200,40,0,0.07)');
                    g.addColorStop(1, 'rgba(200,40,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(lg.x, lg.y, r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Islands
            islands.forEach(isl => drawIsland(isl, map));

            // Player trail
            player.trail.forEach(t => {
                const a = t.life / 18;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.radius * 0.4 * a, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(251,191,36,${a * 0.1})`;
                ctx.fill();
            });

            // Power crates
            powerCrates.forEach(crate => {
                if (crate.opened) return;
                const bob = Math.sin(crate.bobPhase) * 3.5;
                const cy = crate.y + bob;

                // Outer glow
                const gg = ctx.createRadialGradient(crate.x, cy, 0, crate.x, cy, crate.radius * 5);
                gg.addColorStop(0, 'rgba(245,158,11,0.25)');
                gg.addColorStop(1, 'rgba(245,158,11,0)');
                ctx.fillStyle = gg;
                ctx.beginPath();
                ctx.arc(crate.x, cy, crate.radius * 5, 0, Math.PI * 2);
                ctx.fill();

                // Crate body with better detail
                const cr = crate.radius;
                ctx.fillStyle = '#78350f';
                ctx.fillRect(crate.x - cr, cy - cr * 0.7, cr * 2, cr * 1.4);
                ctx.strokeStyle = '#92400e';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(crate.x - cr, cy - cr * 0.7, cr * 2, cr * 1.4);

                // Cross straps
                ctx.strokeStyle = '#fcd34d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(crate.x - cr, cy);
                ctx.lineTo(crate.x + cr, cy);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(crate.x, cy - cr * 0.7);
                ctx.lineTo(crate.x, cy + cr * 0.7);
                ctx.stroke();

                ctx.fillStyle = '#fcd34d';
                ctx.font = `${cr}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚡', crate.x, cy - 1);
            });

            // Coins
            coins.forEach(c => {
                const bob = Math.sin(c.bobPhase) * 3.5;
                const cy = c.y + bob;
                const glow = 0.5 + Math.sin(c.bobPhase) * 0.25;

                const g = ctx.createRadialGradient(c.x, cy, 0, c.x, cy, c.radius * 3.2);
                g.addColorStop(0, `rgba(252,211,77,${glow * 0.28})`);
                g.addColorStop(1, 'rgba(252,211,77,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(c.x, cy, c.radius * 3.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(c.x, cy, c.radius, 0, Math.PI * 2);
                const cg = ctx.createRadialGradient(c.x - 2, cy - 2, 0, c.x, cy, c.radius);
                cg.addColorStop(0, '#fef08a');
                cg.addColorStop(0.5, '#f59e0b');
                cg.addColorStop(1, '#92400e');
                ctx.fillStyle = cg;
                ctx.fill();
                ctx.strokeStyle = 'rgba(146,64,14,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(c.x - 2.5, cy - 3, 2.5, 0, Math.PI * 2);
                ctx.fill();
                if (c.value > 1) {
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = '7px Inter,sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(c.value, c.x, cy + 0.5);
                }
            });

            // Projectiles
            projectiles.forEach(p => {
                p.trail.forEach(t => {
                    const a = t.life / 10;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, p.radius * a * 0.55, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251,191,36,${a * 0.3})`;
                    ctx.fill();
                });

                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 5.5);
                g.addColorStop(0, p.isPlayer ? 'rgba(245,158,11,0.35)' : 'rgba(248,113,113,0.35)');
                g.addColorStop(1, 'rgba(245,158,11,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 5.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = p.glow;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Bright core
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
            });

            // Enemies
            enemies.forEach(e => {
                drawShip(e.x, e.y, e.angle, e.radius, e.hitFlash > 0 ? '#dbeafe' : e.shipColor, e.health, e.maxHealth, false);
                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.font = '9px Inter,sans-serif';
                ctx.textAlign = 'center';
                const lb = { aggressive: '⚔', patrol: '🚩', passive: '🏳' };
                ctx.fillText(lb[e.type] || '⚔', e.x, e.y + e.radius + 15);
            });

            // Boss
            drawBoss();

            // Player
            drawShip(player.x, player.y, player.angle, player.radius,
                currentHero ? currentHero.color : '#c026d3',
                player.health, player.maxHealth, true);

            // Range dashes
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.range, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(245,158,11,0.06)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([6, 10]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Shockwaves
            shockwaves.forEach(sw => {
                const a = sw.life / sw.maxLife;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(245,158,11,${a * 0.4})`;
                ctx.lineWidth = 3 * a;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${a * 0.15})`;
                ctx.lineWidth = 1.5 * a;
                ctx.stroke();
            });

            // Lightning bolts visual (storm map)
            if (currentMap.lightning && lightningFlash > 8) {
                const x1 = player.x + rand(-200, 200), y1 = camera.y;
                const x2 = x1 + rand(-50, 50), y2 = player.y + rand(100, 300);
                ctx.strokeStyle = `rgba(200,180,255,${lightningFlash / 12 * 0.7})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                let cx = x1;
                for (let i = 1; i < 6; i++) { cx += rand(-30, 30); ctx.lineTo(cx, y1 + (y2 - y1) * (i / 5)); }
                ctx.stroke();
                ctx.strokeStyle = `rgba(255,255,255,${lightningFlash / 12 * 0.5})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            ctx.restore();

            // Particles + floaters
            ctx.save();
            ctx.translate(-camera.x, -camera.y);
            particles.forEach(p => {
                const a = p.life / p.maxLife;
                ctx.globalAlpha = a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * a, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            floatingTexts.forEach(ft => {
                const a = ft.life / ft.maxLife;
                ctx.globalAlpha = a;
                ctx.fillStyle = ft.color;
                ctx.font = `bold ${ft.size}px Inter,sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.95)';
                ctx.shadowBlur = 14;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;
            ctx.restore();

            // Vignette fog
            const fog = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.min(W, H) * 0.88);
            fog.addColorStop(0, 'rgba(0,0,0,0)');
            fog.addColorStop(1, map.fogColor || 'rgba(0,0,0,0.55)');
            ctx.fillStyle = fog;
            ctx.fillRect(0, 0, W, H);

            // Lava vignette
            if (map.lava) {
                const lv = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.min(W, H) * 0.9);
                lv.addColorStop(0, 'rgba(0,0,0,0)');
                lv.addColorStop(1, 'rgba(100,10,0,0.3)');
                ctx.fillStyle = lv;
                ctx.fillRect(0, 0, W, H);
            }

            // Map label bottom
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.font = `${Math.max(9, W * 0.011)}px Inter,sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText(`⭐ ${enemies.length}/${maxEnemies}  ${currentMap.icon} ${currentMap.name}`, W - 14, H - 13);
            ctx.textAlign = 'left';
            ctx.fillText(`LVL ${level}`, 14, H - 13);
        }

        function drawIsland(island, map) {
            const { x, y, radius, color, sand } = island;

            // Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(x, y, radius * 1.2, radius * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = sand;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Main land
            ctx.beginPath();
            ctx.ellipse(x, y - radius * 0.18, radius * 0.95, radius * 0.52, 0, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            // Subtle texture overlay
            ctx.beginPath();
            ctx.ellipse(x, y - radius * 0.18, radius * 0.95, radius * 0.52, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Map-specific island features
            if (map.id === 'arctic') {
                // Snow caps
                ctx.beginPath();
                ctx.ellipse(x, y - radius * 0.36, radius * 0.6, radius * 0.28, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(240,248,255,0.7)';
                ctx.fill();
            } else if (map.id === 'volcanic') {
                // Lava cracks
                for (let i = 0; i < 3; i++) {
                    const a = i / 3 * Math.PI * 2;
                    ctx.strokeStyle = 'rgba(255,60,0,0.35)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y - radius * 0.1);
                    ctx.lineTo(x + Math.cos(a) * radius * 0.7, y + Math.sin(a) * radius * 0.35);
                    ctx.stroke();
                }
            }

            // Trees / features
            const treeCount = Math.floor(radius / 12) + 1;
            for (let i = 0; i < treeCount; i++) {
                const a = (i / treeCount) * Math.PI * 2 + 0.3;
                const dx = Math.cos(a) * radius * 0.46, dy = Math.sin(a) * radius * 0.3 - radius * 0.1;
                const tx = x + dx, ty = y + dy;

                if (map.id === 'arctic') {
                    // Pine trees
                    ctx.strokeStyle = '#1e3a2a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(tx, ty); ctx.lineTo(tx, ty - rand(16, 22)); ctx.stroke();
                    for (let j = 0; j < 3; j++) {
                        const bw = (3 - j) * 3.5, bh = ty - rand(6, 10) - j * 5;
                        ctx.fillStyle = `hsl(140,40%,${20 + j * 5}%)`;
                        ctx.beginPath();
                        ctx.moveTo(tx - bw, bh + 6); ctx.lineTo(tx + bw, bh + 6); ctx.lineTo(tx, bh); ctx.fill();
                    }
                } else if (map.id === 'volcanic') {
                    // Charred stumps
                    ctx.strokeStyle = '#1c0500';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(tx, ty); ctx.lineTo(tx + rand(-2, 2), ty - rand(8, 14)); ctx.stroke();
                } else {
                    // Palm trees (default)
                    ctx.strokeStyle = '#713f12';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(tx, ty); ctx.lineTo(tx + rand(-2, 2), ty - rand(16, 25)); ctx.stroke();
                    const lc = 4;
                    for (let j = 0; j < lc; j++) {
                        const la = j / lc * Math.PI * 2 + gameTime * 0.005;
                        const ll = rand(12, 20);
                        ctx.fillStyle = `hsl(${120 + j * 5},${55 + j * 5}%,${35 + j * 4}%)`;
                        ctx.beginPath();
                        ctx.moveTo(tx, ty - rand(14, 24));
                        ctx.quadraticCurveTo(
                            tx + Math.cos(la) * ll * 0.7, ty - rand(14, 24) - Math.sin(la + 0.5) * ll * 0.7,
                            tx + Math.cos(la) * ll, ty - rand(14, 24) - Math.sin(la) * ll * 0.5
                        );
                        ctx.fill();
                    }
                }
            }
        }

        function drawMinimap() {
            const mc = minimapCtx;
            mc.clearRect(0, 0, MW, MH);

            mc.fillStyle = 'rgba(5,8,16,0.8)';
            mc.fillRect(0, 0, MW, MH);

            const scale = MW / WORLD_W;

            // Map tint
            mc.fillStyle = currentMap.id === 'volcanic' ? 'rgba(60,10,0,0.3)' :
                currentMap.id === 'arctic' ? 'rgba(10,30,60,0.3)' :
                    currentMap.id === 'storm' ? 'rgba(20,10,50,0.3)' : 'rgba(0,15,40,0.3)';
            mc.fillRect(0, 0, MW, MH);

            mc.fillStyle = 'rgba(74,222,128,0.28)';
            islands.forEach(isl => {
                mc.beginPath();
                mc.arc(isl.x * scale, isl.y * scale, isl.radius * scale * 0.6, 0, Math.PI * 2);
                mc.fill();
            });

            mc.fillStyle = '#fcd34d';
            powerCrates.forEach(c => { mc.beginPath(); mc.arc(c.x * scale, c.y * scale, 2.8, 0, Math.PI * 2); mc.fill(); });

            mc.fillStyle = '#f87171';
            enemies.forEach(e => { mc.beginPath(); mc.arc(e.x * scale, e.y * scale, 2.2, 0, Math.PI * 2); mc.fill(); });

            if (boss) {
                mc.fillStyle = boss.villain.glow;
                mc.beginPath();
                mc.arc(boss.x * scale, boss.y * scale, 4, 0, Math.PI * 2);
                mc.fill();
            }

            mc.fillStyle = 'rgba(252,211,77,0.5)';
            coins.forEach(c => { mc.fillRect(c.x * scale - 1, c.y * scale - 1, 2, 2); });

            mc.fillStyle = '#ffd700';
            mc.beginPath();
            mc.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
            mc.fill();

            mc.strokeStyle = 'rgba(255,255,255,0.18)';
            mc.lineWidth = 1;
            mc.strokeRect(camera.x * scale, camera.y * scale, W * scale, H * scale);

            mc.strokeStyle = 'rgba(184,134,11,0.5)';
            mc.lineWidth = 2.5;
            mc.strokeRect(1, 1, MW - 2, MH - 2);
        }

        // =====================================================================
        // GAME LOOP
        // =====================================================================
        function gameLoop() {
            if (!gameRunning) {
                requestAnimationFrame(gameLoop);
                return;
            }
            update();
            drawWorld();
            if (player) drawMinimap();
            requestAnimationFrame(gameLoop);
        }

        // =====================================================================
        // INIT GAME — FRESH START
        // =====================================================================
        function initGame(hero, map) {
            currentHero = hero;
            currentMap = map;

            player = {
                x: WORLD_W / 2, y: WORLD_H / 2,
                radius: 16, baseRadius: 16,
                angle: 0, vx: 0, vy: 0, trail: [],
                heroStats: { ...hero.stats },
                baseStats: { speed: 2.55, damage: 18, maxHealth: 100, fireRate: 23, range: 255 },
                maxSpeed: 0, damage: 0, health: 100, maxHealth: 100,
                fireRate: 23, fireCooldown: 0, range: 255,
                upgradeLevels: { speed: 1, damage: 1, health: 1, fireRate: 1, range: 1 },
                upgradeCosts: { speed: 30, damage: 40, health: 35, fireRate: 45, range: 40 },
                maxUpgradeLevel: 11,
                specialCooldown: 0, specialMaxCooldown: 560
            };

            updatePlayerStats();
            player.health = player.maxHealth;

            coinsCollected = 0; kills = 0; level = 1;
            gameRunning = true; gameTime = 0;
            spawnTimer = 0; enemySpawnTimer = 0; crateSpawnTimer = 0;
            maxEnemies = 10; achievementQueue = [];
            lightningFlash = 0; lastLightning = 0;

            projectiles = []; enemies = []; coins = [];
            particles = []; floatingTexts = [];
            powerCrates = []; shockwaves = [];

            boss = null; bossSpawnTimer = 0; bossCooldown = 900; bossRetreatTimer = 0;
            bossBarEl.classList.remove('show');

            generateIslands(map);
            generateEnvironmentDetails(map);
            spawnCoins(48);
            for (let i = 0; i < 11; i++) spawnEnemy();
            for (let i = 0; i < 3; i++) spawnPowerCrate();

            specialBtn.style.display = 'flex';
            specialIcon.textContent = hero.special.icon;
            specialName.textContent = hero.special.name;

            updateUI();
            updateUpgradeButtons();

            // Flash map name
            mapNameFlash.textContent = map.icon + ' ' + map.name.toUpperCase();
            mapNameFlash.classList.add('show');
            setTimeout(() => mapNameFlash.classList.remove('show'), 2200);
        }

        // =====================================================================
        // RESTART — resets and reuses same hero & map
        // =====================================================================
        function restartGame() {
            if (!currentHero || !currentMap) return;

            gameOverDiv.classList.remove('show');

            // Reset all arrays
            projectiles = []; enemies = []; coins = [];
            particles = []; floatingTexts = [];
            powerCrates = []; shockwaves = [];
            lightningFlash = 0;
            boss = null; bossSpawnTimer = 0; bossCooldown = 900; bossRetreatTimer = 0;
            bossBarEl.classList.remove('show');

            // Reset player
            player.x = WORLD_W / 2; player.y = WORLD_H / 2;
            player.radius = player.baseRadius;
            player.angle = 0; player.vx = 0; player.vy = 0; player.trail = [];
            player.heroStats = { ...currentHero.stats };
            player.upgradeLevels = { speed: 1, damage: 1, health: 1, fireRate: 1, range: 1 };
            player.fireCooldown = 0; player.specialCooldown = 0;

            updatePlayerStats();
            player.health = player.maxHealth;

            // Reset counters
            coinsCollected = 0; kills = 0; level = 1;
            gameTime = 0; spawnTimer = 0; enemySpawnTimer = 0;
            crateSpawnTimer = 0; maxEnemies = 10; achievementQueue = [];
            lastLightning = 0;

            // Regenerate world
            generateIslands(currentMap);
            generateEnvironmentDetails(currentMap);
            spawnCoins(42);
            for (let i = 0; i < 9; i++) spawnEnemy();
            for (let i = 0; i < 3; i++) spawnPowerCrate();

            // IMPORTANT: set gameRunning AFTER resetting everything
            gameRunning = true;

            updateUI();
            updateUpgradeButtons();

            // Flash map name again
            mapNameFlash.textContent = currentMap.icon + ' ' + currentMap.name.toUpperCase();
            mapNameFlash.classList.add('show');
            setTimeout(() => mapNameFlash.classList.remove('show'), 2000);
        }

        // =====================================================================
        // START SCREEN SETUP
        // =====================================================================
        function setupStartScreen() {
            // Map cards
            mapSelectEl.innerHTML = '';
            MAPS.forEach(map => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.dataset.map = map.id;

                // Gradient preview
                const colors = {
                    ocean: 'linear-gradient(135deg,#04111f,#083050)',
                    volcanic: 'linear-gradient(135deg,#120500,#3d1000)',
                    arctic: 'linear-gradient(135deg,#060d14,#1a3a5c)',
                    storm: 'linear-gradient(135deg,#08060e,#1a1245)'
                };

                card.innerHTML = `
      <div class="map-preview" style="background:${colors[map.id]}">${map.icon}</div>
      <div class="map-name">${map.name}</div>
      <div class="map-desc">${map.desc}</div>
    `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedMap = map;
                    checkStartReady();
                });

                mapSelectEl.appendChild(card);
            });

            // Hero cards
            heroSelect.innerHTML = '';
            HEROES.forEach(hero => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                card.dataset.hero = hero.id;
                card.innerHTML = `
      <span class="emoji">${hero.emoji}</span>
      <div class="name">${hero.name}</div>
      <div class="ability">${hero.special.name}</div>
      <div class="stats">
        <span>⚡<span class="val">${hero.stats.speed.toFixed(1)}</span></span>
        <span>💥<span class="val">${hero.stats.damage.toFixed(1)}</span></span>
        <span>❤️<span class="val">${hero.stats.health.toFixed(1)}</span></span>
      </div>
    `;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedHero = hero;
                    checkStartReady();
                });
                heroSelect.appendChild(card);
            });
        }

        function checkStartReady() {
            if (selectedHero && selectedMap) {
                startBtn.disabled = false;
                startBtn.textContent = `${selectedMap.icon} INICIAR — ${selectedHero.emoji} ${selectedHero.name}`;
            } else if (selectedHero) {
                startBtn.disabled = true;
                startBtn.textContent = 'Escolha um Mapa';
            } else if (selectedMap) {
                startBtn.disabled = true;
                startBtn.textContent = 'Escolha um Herói';
            } else {
                startBtn.disabled = true;
                startBtn.textContent = 'Selecione herói e mapa';
            }
        }

        startBtn.addEventListener('click', () => {
            if (!selectedHero || !selectedMap) return;
            startScreen.classList.add('hidden');
            initGame(selectedHero, selectedMap);
            if (!gameInitialized) {
                gameInitialized = true;
                gameLoop();
            }
        });

        // =====================================================================
        // INPUT
        // =====================================================================
        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = true;
            if (k === 's' || k === 'arrowdown') keys.s = true;
            if (k === 'a' || k === 'arrowleft') keys.a = true;
            if (k === 'd' || k === 'arrowright') keys.d = true;
            if (k === ' ') { keys.space = true; e.preventDefault(); if (gameRunning) triggerSpecial(); }
            if (k === 'r' && !gameRunning && gameInitialized) restartGame();
        });

        document.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = false;
            if (k === 's' || k === 'arrowdown') keys.s = false;
            if (k === 'a' || k === 'arrowleft') keys.a = false;
            if (k === 'd' || k === 'arrowright') keys.d = false;
            if (k === ' ') keys.space = false;
        });

        canvas.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            mouseX = clamp(e.clientX - r.left, 0, W);
            mouseY = clamp(e.clientY - r.top, 0, H);
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) { mouseDown = true; canvas.focus(); initAudio(); }
        });
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mouseleave', () => mouseDown = false);
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Touch
        function setupTouchControls() {
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                initAudio();
                const r = canvas.getBoundingClientRect();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const tx = t.clientX - r.left, ty = t.clientY - r.top;
                    if (tx < W * 0.42 && !joystickActive) {
                        joystickActive = true; joystickId = t.identifier;
                        joystickStartX = tx; joystickStartY = ty;
                        joystick.style.left = `${tx - 46}px`;
                        joystick.style.top = `${ty - 46}px`;
                        joystick.style.display = 'block';
                        joystickKnob.style.left = '50%';
                        joystickKnob.style.top = '50%';
                    } else {
                        touchAimActive = true;
                        touchAimX = tx + camera.x; touchAimY = ty + camera.y;
                        mouseX = tx; mouseY = ty; mouseDown = true;
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const tx = t.clientX - r.left, ty = t.clientY - r.top;
                    if (joystickActive && t.identifier === joystickId) {
                        const dx = tx - joystickStartX, dy = ty - joystickStartY;
                        const mx = 42, dv = Math.hypot(dx, dy);
                        let nx = dx, ny = dy;
                        if (dv > mx) { nx *= mx / dv; ny *= mx / dv; }
                        joystickDeltaX = nx / mx; joystickDeltaY = ny / mx;
                        joystickKnob.style.left = `${50 + (nx / mx) * 50}%`;
                        joystickKnob.style.top = `${50 + (ny / mx) * 50}%`;
                    } else if (touchAimActive) {
                        mouseX = tx; mouseY = ty;
                        touchAimX = tx + camera.x; touchAimY = ty + camera.y;
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (joystickActive && t.identifier === joystickId) {
                        joystickActive = false; joystickId = null;
                        joystickDeltaX = 0; joystickDeltaY = 0;
                        joystick.style.display = 'none';
                    }
                    if (touchAimActive) { mouseDown = false; touchAimActive = false; }
                }
            }, { passive: false });

            specialBtn.addEventListener('touchstart', e => {
                e.preventDefault();
                if (gameRunning) triggerSpecial();
            });
        }

        upgradeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!gameRunning || !player) return;
                applyUpgrade(btn.dataset.upgrade);
            });
        });

        restartBtn.addEventListener('click', () => {
            restartGame();
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { });
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        function resizeCanvas() {
            const w = document.getElementById('gameWrapper');
            W = w.clientWidth; H = w.clientHeight;
            canvas.width = W; canvas.height = H;
        }

        window.addEventListener('resize', resizeCanvas);

        // =====================================================================
        // BOOT
        // =====================================================================
        function boot() {
            resizeCanvas();
            setupStartScreen();
            setupTouchControls();

            // Pre-select first options for convenience — but only if the
            // player hasn't already picked something themselves, so a fast
            // manual selection is never silently overridden.
            setTimeout(() => {
                if (!selectedMap) {
                    const firstMap = document.querySelector('.map-card');
                    if (firstMap) firstMap.click();
                }
                if (!selectedHero) {
                    const firstHero = document.querySelector('.hero-card');
                    if (firstHero) firstHero.click();
                }
            }, 300);
        }

        boot();
    </script>
</body>

</html>
