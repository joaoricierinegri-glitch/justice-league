<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦸 JUSTICE LEAGUE ARENA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap');

        :root {
            --gold: #ffd700;
            --dark: #050810;
            --accent: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #050810;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            width: 100vw;
            color: #fff;
        }

        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            background: #050810;
            outline: none;
            touch-action: none;
        }

        /* ── START SCREEN ── */
        #startScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 20%, #0d1f3e 0%, #050810 70%);
            z-index: 100;
            padding: 20px;
            transition: opacity 0.6s ease;
            overflow-y: auto;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(32px, 7vw, 72px);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffe066, #ffd700, #f0c040, #ffe066);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 2px;
            text-align: center;
        }

        @keyframes shimmer {
            0% {
                background-position: 0%
            }

            100% {
                background-position: 200%
            }
        }

        .start-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: clamp(11px, 1.6vw, 16px);
            letter-spacing: 5px;
            margin-bottom: 28px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .section-label {
            font-size: clamp(10px, 1.2vw, 14px);
            letter-spacing: 4px;
            color: rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* ── MAP SELECTION ── */
        #mapSelect {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 820px;
        }

        .map-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            width: 155px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
        }

        .map-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.06);
        }

        .map-card.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.18);
        }

        .map-card .map-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
            overflow: hidden;
        }

        .map-card .map-name {
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            margin-bottom: 2px;
        }

        .map-card .map-desc {
            font-size: 9.5px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.3;
        }

        /* ── HERO SELECT ── */
        #heroSelect {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 900px;
            margin-bottom: 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px 10px 14px;
            width: 112px;
            text-align: center;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 255, 255, 0.07);
        }

        .hero-card.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.18);
            transform: translateY(-2px);
        }

        .hero-card .emoji {
            font-size: 42px;
            display: block;
            margin-bottom: 4px;
            line-height: 1;
            filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.5));
        }

        .hero-card .name {
            color: #fff;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .hero-card .ability {
            font-size: 9px;
            color: #a3bffa;
            margin-bottom: 6px;
            font-weight: 600;
            line-height: 1.2;
            min-height: 22px;
        }

        .hero-card .stats {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .hero-card .stats span {
            background: rgba(0, 0, 0, 0.4);
            padding: 1px 5px;
            border-radius: 8px;
            font-size: 8.5px;
            color: #e2d9b8;
        }

        .hero-card .stats .val {
            color: #ffd700;
            font-weight: 700;
        }

        #startBtn {
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            background-size: 200%;
            border: none;
            color: #0a0e1a;
            font-size: clamp(16px, 2.8vw, 28px);
            font-weight: 900;
            padding: 14px 60px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 35px rgba(184, 134, 11, 0.45);
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            animation: shimmer 2s linear infinite;
        }

        #startBtn:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 8px 50px rgba(184, 134, 11, 0.6);
        }

        #startBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .credit {
            position: absolute;
            bottom: 16px;
            color: rgba(255, 255, 255, 0.1);
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* ── HUD ── */
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 18px;
        }

        #hudLeft,
        #hudRight {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        #hudLeft {
            color: #ffd700;
            font-size: clamp(14px, 2vw, 22px);
            font-weight: 700;
        }

        #hudLeft span {
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #hudRight {
            color: #fff;
            font-size: clamp(11px, 1.7vw, 19px);
            align-items: flex-end;
            gap: 3px;
        }

        #hudRight span {
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 12px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .healthBar {
            width: clamp(120px, 20vw, 220px);
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 2px;
        }

        .healthFill {
            height: 100%;
            width: 100%;
            border-radius: 12px;
            transition: width 0.15s linear;
        }

        /* ── UPGRADES ── */
        #upgradePanel {
            position: absolute;
            bottom: clamp(10px, 3vh, 24px);
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            display: flex;
            gap: 6px;
            background: rgba(5, 8, 16, 0.92);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid rgba(184, 134, 11, 0.22);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            flex-wrap: wrap;
            justify-content: center;
            z-index: 20;
        }

        .upgradeBtn {
            background: rgba(20, 28, 48, 0.9);
            border: 1px solid rgba(184, 134, 11, 0.25);
            color: #e0d5b0;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: clamp(10px, 1vw, 12.5px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-family: inherit;
        }

        .upgradeBtn:hover {
            background: rgba(184, 134, 11, 0.2);
            border-color: #ffd700;
            transform: scale(1.03);
        }

        .upgradeBtn:active {
            transform: scale(0.95);
        }

        .upgradeBtn .cost {
            color: #ffd700;
            font-size: 0.78em;
            font-weight: 800;
        }

        .upgradeBtn .lvl {
            color: #7890b8;
            font-size: 0.72em;
            background: rgba(0, 0, 0, 0.35);
            padding: 0 5px;
            border-radius: 8px;
        }

        .upgradeBtn.disabled {
            opacity: 0.32;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ── GAME OVER ── */
        #gameOver {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            flex-direction: column;
            z-index: 200;
            gap: 16px;
            pointer-events: none;
        }

        #gameOver.show {
            display: flex;
            pointer-events: auto;
        }

        #gameOver h1 {
            font-family: 'Orbitron', sans-serif;
            color: #ef4444;
            font-size: clamp(38px, 7vw, 80px);
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.5);
            letter-spacing: 4px;
        }

        #gameOver .go-stats {
            color: #ffd700;
            font-size: clamp(14px, 2.4vw, 26px);
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.18);
        }

        #gameOver button {
            background: linear-gradient(135deg, #b8860b, #ffd700);
            border: none;
            color: #050810;
            font-size: clamp(15px, 2.5vw, 26px);
            font-weight: 900;
            padding: 14px 52px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 4px 40px rgba(184, 134, 11, 0.4);
            pointer-events: auto;
        }

        #gameOver button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 50px rgba(184, 134, 11, 0.6);
        }

        /* ── SPECIAL ── */
        #specialBtn {
            position: absolute;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 18px rgba(59, 130, 246, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 40;
            white-space: nowrap;
        }

        #specialBtn:hover {
            transform: translateX(-50%) scale(1.04);
        }

        #specialBtn.disabled {
            opacity: 0.28;
            pointer-events: none;
        }

        /* ── JOYSTICK ── */
        #joystick {
            position: absolute;
            bottom: 60px;
            left: 48px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
            touch-action: none;
            z-index: 50;
            display: none;
        }

        #joystick .knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
        }

        /* ── MINIMAP ── */
        #minimap {
            position: absolute;
            bottom: clamp(56px, 9vh, 90px);
            right: clamp(10px, 2vw, 24px);
            width: clamp(70px, 11vw, 126px);
            height: clamp(70px, 11vw, 126px);
            border-radius: 50%;
            border: 2px solid rgba(184, 134, 11, 0.3);
            background: rgba(0, 0, 0, 0.65);
            pointer-events: none;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        #minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* ── CONTROLS HINT ── */
        #controlsHint {
            position: absolute;
            bottom: clamp(56px, 9vh, 90px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.18);
            font-size: clamp(9px, 1.1vw, 13px);
            letter-spacing: 1.5px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ── FULLSCREEN ── */
        #fullscreenBtn {
            position: absolute;
            top: 14px;
            right: 16px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 5px 13px;
            border-radius: 28px;
            font-size: 11.5px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.2s;
            z-index: 30;
        }

        #fullscreenBtn:hover {
            background: rgba(255, 215, 0, 0.12);
            border-color: #ffd700;
        }

        /* ── ACHIEVEMENT ── */
        #achievement {
            position: absolute;
            bottom: clamp(86px, 15vh, 128px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 7px 22px;
            border-radius: 30px;
            color: #ffd700;
            font-size: clamp(12px, 1.9vw, 20px);
            font-weight: 700;
            border: 1px solid rgba(255, 215, 0, 0.28);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
            white-space: nowrap;
            z-index: 30;
        }

        #achievement.show {
            opacity: 1;
        }

        /* ── MAP NAME FLASH ── */
        #mapNameFlash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 4vw, 48px);
            color: #ffd700;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transition: opacity 0.5s;
        }

        #mapNameFlash.show {
            opacity: 1;
        }

        /* ── BOSS UI ── */
        #bossBar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: min(86vw, 520px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 45;
            text-align: center;
        }

        #bossBar.show {
            opacity: 1;
        }

        #bossBar .bossName {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(13px, 2vw, 20px);
            color: #f87171;
            text-shadow: 0 0 16px rgba(239, 68, 68, 0.7);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        #bossBar .bossTrack {
            width: 100%;
            height: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }

        #bossBar .bossFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #7f1d1d, #ef4444, #f87171);
            transition: width 0.15s linear;
        }

        @media (max-width: 600px) {
            #joystick {
                display: block;
                bottom: 48px;
                left: 26px;
                width: 90px;
                height: 90px;
            }

            #joystick .knob {
                width: 32px;
                height: 32px;
            }

            #specialBtn {
                bottom: 50px;
                font-size: 11px;
                padding: 6px 16px;
            }

            #upgradePanel {
                bottom: 7px;
                padding: 4px 8px;
                gap: 4px;
                border-radius: 28px;
            }

            .upgradeBtn {
                padding: 3px 7px;
                font-size: 9px;
            }

            #hud {
                padding: 8px 10px;
            }

            .healthBar {
                width: 68px;
                height: 7px;
            }

            #minimap {
                width: 50px;
                height: 50px;
                bottom: 40px;
                right: 9px;
            }

            #controlsHint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="gameWrapper">
        <canvas id="gameCanvas" tabindex="0"></canvas>

        <!-- START SCREEN -->
        <div id="startScreen">
            <div class="start-logo">🦸 JUSTICE LEAGUE</div>
            <div class="start-sub">Arena Combat — Edição 2026</div>

            <div class="section-label">Escolha o Mapa</div>
            <div id="mapSelect"></div>

            <div class="section-label">Escolha o Herói</div>
            <div id="heroSelect"></div>

            <button id="startBtn" disabled>Selecione herói e mapa</button>
            <div class="credit">DC Comics Fan Game • 2026</div>
        </div>

        <!-- IN-GAME UI -->
        <div id="ui">
            <button id="fullscreenBtn">⛶ FULLSCREEN</button>

            <div id="bossBar">
                <div class="bossName" id="bossNameLabel">⚠️ VILÃO</div>
                <div class="bossTrack">
                    <div class="bossFill" id="bossFill"></div>
                </div>
            </div>

            <div id="hud">
                <div id="hudLeft">
                    <span>🪙 <span id="coinDisplay">0</span></span>
                    <div class="healthBar">
                        <div class="healthFill" id="healthFill" style="width:100%"></div>
                    </div>
                </div>
                <div id="hudRight">
                    <span>⭐ <span id="killDisplay">0</span></span>
                    <span>LVL <span id="levelDisplay">1</span></span>
                    <span style="font-size:.7em;opacity:.5">📏 <span id="sizeDisplay">16</span></span>
                </div>
            </div>

            <div id="upgradePanel">
                <button class="upgradeBtn" data-upgrade="speed">⚡ VEL <span class="lvl" id="lvlSpeed">1</span><span
                        class="cost" id="costSpeed">30</span></button>
                <button class="upgradeBtn" data-upgrade="damage">💥 DANO <span class="lvl" id="lvlDamage">1</span><span
                        class="cost" id="costDamage">40</span></button>
                <button class="upgradeBtn" data-upgrade="health">❤️ VIDA <span class="lvl" id="lvlHealth">1</span><span
                        class="cost" id="costHealth">35</span></button>
                <button class="upgradeBtn" data-upgrade="fireRate">🔥 CAD <span class="lvl"
                        id="lvlFireRate">1</span><span class="cost" id="costFireRate">45</span></button>
                <button class="upgradeBtn" data-upgrade="range">📏 ALC <span class="lvl" id="lvlRange">1</span><span
                        class="cost" id="costRange">40</span></button>
            </div>

            <button id="specialBtn" class="disabled">
                <span id="specialIcon">⚡</span>
                <span id="specialName">ESPECIAL</span>
            </button>

            <div id="joystick">
                <div class="knob"></div>
            </div>
            <div id="controlsHint">WASD • Clique/Toque para atacar • Espaço para especial</div>

            <div id="minimap"><canvas id="minimapCanvas" width="140" height="140"></canvas></div>
            <div id="achievement">🏆 Conquista!</div>
            <div id="mapNameFlash"></div>

            <div id="gameOver">
                <h1>DERROTA</h1>
                <div class="go-stats">
                    <span>🪙 <span id="finalCoins">0</span></span>
                    <span>⭐ <span id="finalKills">0</span></span>
                    <span>🏆 <span id="highScore">0</span></span>
                </div>
                <button id="restartBtn">JOGAR NOVAMENTE</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // 🦸 JUSTICE LEAGUE ARENA — REMASTER
        // Melhorias: seleção de mapa, gráficos, bug restart corrigido, boss vilão
        // =====================================================================

        const WORLD_W = 3400, WORLD_H = 3400;
        const MAX_PARTICLES = 500;

        // =====================================================================
        // MAP DEFINITIONS
        // =====================================================================
        const MAPS = [
            {
                id: 'ocean',
                name: 'Alto Mar',
                icon: '🌊',
                desc: 'Ondas eternas\nmarés perigosas',
                bg0: '#04111f',
                bg1: '#062035',
                bg2: '#083050',
                wave: 'rgba(80,160,255,0.06)',

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, dur, type = 'sawtooth', vol = 0.15) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filt = audioCtx.createBiquadFilter();
                osc.type = type; osc.frequency.value = freq;
                filt.type = 'lowpass'; filt.frequency.value = 1800;
                gain.gain.value = vol;
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch (e) { }
        }

        function soundShoot() { playTone(780, 0.07, 'square', 0.11); }
        function soundCoin() { playTone(1250, 0.07, 'sine', 0.16); playTone(1600, 0.1, 'sine', 0.09); }
        function soundExplosion() { playTone(165, 0.35, 'sawtooth', 0.2); playTone(90, 0.5, 'sawtooth', 0.15); }
        function soundHit() { playTone(320, 0.1, 'square', 0.12); }
        function soundDamage() { playTone(210, 0.22, 'sawtooth', 0.17); }
        function soundSpecial() { playTone(680, 0.12, 'sine', 0.18); playTone(920, 0.3, 'sine', 0.13); }
        function soundLightning() { playTone(80, 0.5, 'sawtooth', 0.25); playTone(200, 0.2, 'square', 0.1); }
        function soundBoss() { playTone(60, 0.6, 'sawtooth', 0.28); playTone(140, 0.4, 'square', 0.2); playTone(45, 0.8, 'sine', 0.22); }

        const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));

        function angleDiff(a, b) {
            let d = b - a;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return d;
        }

        // =====================================================================
        // BOSS (VILLAIN) — themed after the chosen hero's arch-nemesis.
        // Designed to be brutally hard: huge health pool that regenerates
        // faster than sustained player DPS, high damage, and an enrage phase
        // that punishes standing still. It periodically retreats instead of
        // ever truly dying, so it never soft-locks the run.
        // =====================================================================
        function spawnBoss() {
            if (!currentHero) return;
            const villain = VILLAINS[currentHero.id];
            let x, y, att = 0;
            do {
                x = rand(160, WORLD_W - 160); y = rand(160, WORLD_H - 160);
                att++;
            } while (dist({ x, y }, player) < 520 && att < 25);

            const lvl = Math.min(level, 30);
            const maxHealth = 2400 + lvl * 260;

            boss = {
                x, y, radius: 30,
                health: maxHealth * 0.55, maxHealth,
                angle: 0, vx: 0, vy: 0,
                speed: (player.maxSpeed || 3) * 1.08,
                damage: 24 + lvl * 2.2,
                fireRate: 26, fireCooldown: 40,
                villain, hitFlash: 0,
                phase: 'chase',
                enraged: false,
                lifeMs: 0,
                shockTimer: randInt(140, 220),
                isBoss: true
            };
